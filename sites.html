<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebug co.</title>

    <style type="text/css">
        html, body {
            height: 100%; /* Important for full page height */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide main page scrollbars */
        }

        .container {
            display: grid;
            /* Creates a 2x2 grid with equal width and height for each cell */
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh; /* Viewport height */
            gap: 10px; /* Optional: adds space between iframes */
            padding: 10px;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc; /* Optional: adds a border around each website view */
            box-sizing: border-box;
        }
    </style>

</head>
<body>
    <div class="container">
        <iframe src="https://pezheads.org" title="pezheads.org"></iframe>
        <iframe src="https://thefoop.org" title="thefoop.org"></iframe>
        <iframe src="https://jamiegerdes.com" title="jamiegerdes.com"></iframe>
        <iframe src="https://ebug.com" title="ebug.com"></iframe>
    </div>
</body>
</html>
