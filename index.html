<html>

<head>

<title>www.ebug.com</title>

<style type="text/css">
/* Center the container in the middle of the browser */
body {
  font-family: verdana, arial, helvetica;
  font-size: 12pt;
  a:link, a:visited, a:active {
      text-decoration: none;
      color: black;
  }
  a:hover { color:red; }

  margin: 0;
  display: flex;
  justify-content: center; /* Horizontal centering */
  align-items: center;     /* Vertical centering */
  min-height: 100vh;       /* Full viewport height */
  background-color: white;
}

.image-container {
  display: grid;
  place-items: center;
  position: relative;
}

.image-container img {
  /* This ensures they stack on the same grid cell */
  grid-area: 1 / 1;

  /* Keep the original size */
  width: auto;
  height: auto;
  /* transition: opacity 0.3s ease; /* Smooth fade effect */
  transform: translateY(-25%); /* Moves image up by % of it's height */
}

/* Hide the top image by default */
.img-front {
  opacity: 0;
}

/* On hover, swap visibility */
.image-container:hover .img-front {
  opacity: 1;
}
.image-container:hover .img-back {
  opacity: 0;
}

.bottom-right-container {
    /* Positions the element relative to the browser window (viewport) */
    position: fixed;

    right: 0;        /* Aligns the right edge to the right edge of the window */
    bottom: 0;       /* Aligns the bottom edge to the bottom edge of the window */
    background-color: white;
    padding: 15px;
    border: 0px solid black;
    z-index: 1000;             /* Ensures the div is on top of other content */
}

</style>
</head>

<body>

    <div class="image-container">
    <img src="images/ebug.gif" alt="ebug" class="img-back">
    <img src="images/ebug_fly.gif" alt="fly ebug" class="img-front">
    </div>

    <!-- div class="bottom-right-container">
        <a href="text.html">&lt;text&gt;</a>
    </div -->

</body>

</html>
